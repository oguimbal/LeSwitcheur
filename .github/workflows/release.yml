name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify version sync
        run: ./bundle/verify-version.sh

      - name: Build release binary
        run: cargo build --release -p switcheur

      # Import the Developer ID Application cert into a temp keychain so
      # `codesign --sign "$CODESIGN_IDENTITY"` inside bundle.sh finds it.
      # Stable identity = TCC grants persist across releases for returning
      # users. The temp keychain is destroyed when the runner ends, so
      # there's no leak. Skipped if the secret is absent — bundle falls
      # back to ad-hoc and the rest of the notarisation chain will fail
      # explicitly (Apple rejects ad-hoc).
      - name: Import signing certificate
        env:
          CODESIGN_CERT_P12_BASE64: ${{ secrets.CODESIGN_CERT_P12_BASE64 }}
          CODESIGN_CERT_PASSWORD: ${{ secrets.CODESIGN_CERT_PASSWORD }}
        run: |
          if [ -z "$CODESIGN_CERT_P12_BASE64" ]; then
            echo "No signing secret configured — bundle will ad-hoc sign."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo -n "$CODESIGN_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # `-T /usr/bin/codesign` whitelists codesign so it can use the key
          # without a GUI prompt (no GUI on a runner anyway). `-A` would also
          # work but is broader. `-f pkcs12` without `-t` lets security import
          # both the cert and its bundled private key.
          security import "$CERT_PATH" -P "$CODESIGN_CERT_PASSWORD" \
              -f pkcs12 -k "$KEYCHAIN_PATH" \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          # `-k` here is the keychain *password*, not the path — needed so the
          # ACL update doesn't trigger an interactive unlock prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Verify imported identity
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          echo ">> Identities in temp keychain:"
          security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain-db" || true
          echo ">> Identities in current search path:"
          security find-identity -v -p codesigning || true
          echo ">> CODESIGN_IDENTITY length: ${#CODESIGN_IDENTITY} chars (value masked)"
          # Fail fast with a clear message if codesign won't find the identity,
          # rather than letting bundle.sh die with the cryptic "no identity
          # found" error several lines later.
          if ! security find-identity -v -p codesigning | grep -q "$CODESIGN_IDENTITY"; then
              echo "FATAL: CODESIGN_IDENTITY not found in keychain search path." >&2
              echo "Either the .p12 was exported without its private key, or the" >&2
              echo "CODESIGN_IDENTITY secret doesn't match the cert's common name." >&2
              exit 1
          fi

      # Hit the notary service before we spend 30s+ building the bundle, so
      # a wrong app-specific password fails fast with a useful diagnostic
      # rather than after a successful sign + zip + upload attempt.
      - name: Verify notary credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          echo ">> NOTARY_APPLE_ID length: ${#NOTARY_APPLE_ID} chars"
          echo ">> NOTARY_TEAM_ID length: ${#NOTARY_TEAM_ID} chars"
          echo ">> NOTARY_PASSWORD length: ${#NOTARY_PASSWORD} chars"
          xcrun notarytool history \
              --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" \
              --password "$NOTARY_PASSWORD" \
              | head -5

      - name: Bundle .app
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: ./bundle/bundle.sh

      # Notarise the .app first, then staple the ticket back into the
      # bundle. Stapling the inner .app (in addition to the DMG below)
      # means a user who copies the app out of the DMG before going
      # online still gets through Gatekeeper.
      - name: Notarise .app
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./bundle/notarize.sh dist/LeSwitcheur.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: ./bundle/dmg.sh

      - name: Notarise DMG
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./bundle/notarize.sh dist/LeSwitcheur.dmg

      - name: Publish GitHub Release (DMG)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LeSwitcheur.dmg
          generate_release_notes: true
          draft: false
          prerelease: false

  build-windows:
    # Windows build: produces (1) a portable `.zip` (stripped release `.exe`
    # statically linked against MSVCRT, no extra runtime DLLs, no installer)
    # and (2) an Inno Setup `.exe` installer (per-user, no UAC). Neither is
    # signed yet — early Windows builds ship as unsigned previews until we
    # set up SignTool with an EV cert. The job appends both assets to the
    # same GitHub Release the macOS job creates (softprops merges by tag).
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p switcheur

      - name: Stage portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $tag = "${{ github.ref_name }}"
          $stage = "dist\LeSwitcheur-$tag-windows-x86_64-portable"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target\release\switcheur.exe "$stage\LeSwitcheur.exe"
          Copy-Item LICENSE "$stage\LICENSE"
          Copy-Item README.md "$stage\README.md"
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\LeSwitcheur-$tag-windows-x86_64-portable.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"      # e.g. "v0.1.15"
          $ver = $tag.TrimStart('v')           # "0.1.15"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) {
              # Inno Setup 6 is preinstalled on the windows-latest runner image.
              # Failing loud here is intentional: a silent skip would mean a
              # release without the installer, which is worse than a CI failure.
              throw "ISCC not found at $iscc - runner image changed?"
          }
          & $iscc /DAppVersion=$ver bundle\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed: $LASTEXITCODE" }
          # Stable filename (no version) so /releases/latest/download/<name>
          # resolves across versions — matches the macOS LeSwitcheur.dmg.
          $out = "dist\LeSwitcheur-setup.exe"
          if (-not (Test-Path $out)) { throw "expected $out" }
          Get-Item $out | Format-List Name,Length,LastWriteTime

      - name: Publish GitHub Release (Windows artifacts)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LeSwitcheur-${{ github.ref_name }}-windows-x86_64-portable.zip
            dist/LeSwitcheur-setup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
