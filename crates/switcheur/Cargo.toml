[package]
name = "switcheur"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "switcheur"
path = "src/main.rs"

[target.'cfg(target_os = "windows")'.build-dependencies]
# Multi-size .ico generated from brand/logo-256.png and embedded as
# resource ID 1 — GPUI's Windows backend picks that up as the window
# class icon (title bar + taskbar + Alt+Tab).
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.4"
embed-resource = "3"

[dependencies]
switcheur-core = { workspace = true }
switcheur-i18n = { workspace = true }
switcheur-platform = { workspace = true }
switcheur-ui = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-channel = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { workspace = true }
open = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
directories = { workspace = true }
tray-icon = { workspace = true }
image = { workspace = true }
crossbeam-channel = { workspace = true }
